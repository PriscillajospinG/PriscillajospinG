<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="24" viewBox="0 0 1000 24">
  <defs>
    <linearGradient id="base" x1="0" x2="1">
      <stop offset="0" stop-color="#7C3AED" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#7C3AED" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#7C3AED" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="spark" x1="0" x2="1">
      <stop offset="0" stop-color="#c4b5fd" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#e6edf3"/>
      <stop offset="1" stop-color="#c4b5fd" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect x="0" y="11" width="1000" height="2" fill="url(#base)"/>
  <rect x="-160" y="10.5" width="160" height="3" rx="1.5" fill="url(#spark)">
    <animate attributeName="x" from="-160" to="1000" dur="3.5s" repeatCount="indefinite"/>
  </rect>
  <g transform="translate(500 12) rotate(45)">
    <rect x="-5" y="-5" width="10" height="10" fill="#0d1117" stroke="#8b5cf6" stroke-width="2"/>
  </g>
</svg>
