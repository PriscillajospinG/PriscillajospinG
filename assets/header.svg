<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="300" viewBox="0 0 1000 300">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="0.55" stop-color="#160a2e"/>
      <stop offset="1" stop-color="#0d1117"/>
    </linearGradient>
    <linearGradient id="name" x1="0" x2="1">
      <stop offset="0" stop-color="#e6edf3"/>
      <stop offset="0.55" stop-color="#c4b5fd"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="border" x1="0" x2="1">
      <stop offset="0" stop-color="#7C3AED" stop-opacity="0.9"/>
      <stop offset="0.5" stop-color="#7C3AED" stop-opacity="0.15"/>
      <stop offset="1" stop-color="#7C3AED" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="scan" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#7C3AED" stop-opacity="0"/>
      <stop offset="1" stop-color="#7C3AED" stop-opacity="0.18"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#7C3AED" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#7C3AED" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#7C3AED" stroke-opacity="0.09"/>
    </pattern>
    <clipPath id="clip"><rect width="1000" height="300" rx="18"/></clipPath>
  </defs>
  <style>
    .mono{font-family:SFMono-Regular,Consolas,'Liberation Mono',Menlo,monospace}
    .sans{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Ubuntu,Helvetica,Arial,sans-serif}
    .in1{animation:rise .8s ease-out .2s both}
    .in2{animation:rise .8s ease-out .6s both}
    .in3{animation:rise .8s ease-out 1s both}
    .in4{animation:rise .8s ease-out 1.4s both}
    .cursor{animation:blink 1s steps(1) infinite}
    .node{animation:breathe 3s ease-in-out infinite}
    .edge{stroke:#7C3AED;stroke-opacity:.22;stroke-width:1}
    @keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
    @keyframes blink{0%{opacity:1}50%{opacity:0}}
    @keyframes breathe{0%,100%{opacity:1}50%{opacity:.45}}
  </style>

  <g clip-path="url(#clip)">
    <rect width="1000" height="300" fill="url(#bg)"/>
    <rect width="1000" height="300" fill="url(#grid)"/>
    <circle cx="800" cy="150" r="190" fill="url(#glow)"/>

    <!-- scan line -->
    <rect x="0" y="-60" width="1000" height="60" fill="url(#scan)">
      <animate attributeName="y" from="-60" to="300" dur="5s" repeatCount="indefinite"/>
    </rect>

    <!-- window bar -->
    <rect width="1000" height="36" fill="#0d1117" fill-opacity="0.7"/>
    <line x1="0" y1="36" x2="1000" y2="36" stroke="#7C3AED" stroke-opacity="0.25"/>
    <circle cx="24" cy="18" r="6" fill="#ff5f57"/>
    <circle cx="44" cy="18" r="6" fill="#febc2e"/>
    <circle cx="64" cy="18" r="6" fill="#28c840"/>
    <text x="500" y="23" text-anchor="middle" class="mono" font-size="12" fill="#6e7681">priscilla@ai: ~/profile</text>

    <!-- left: identity -->
    <text x="60" y="98" class="mono in1" font-size="15" fill="#8b5cf6">&gt; whoami</text>
    <text x="58" y="158" class="sans in2" font-size="54" font-weight="800" fill="url(#name)" letter-spacing="-1">Priscilla Jospin G</text>
    <text x="60" y="198" class="mono in3" font-size="16" fill="#c9d1d9">AI Engineer • ML Researcher • Full Stack Developer<tspan class="cursor" fill="#8b5cf6"> ▌</tspan></text>
    <g class="in4">
      <rect x="60" y="226" width="58" height="26" rx="13" fill="#7C3AED" fill-opacity="0.14" stroke="#7C3AED" stroke-opacity="0.55"/>
      <text x="89" y="244" text-anchor="middle" class="mono" font-size="12" fill="#c4b5fd">LLMs</text>
      <rect x="128" y="226" width="146" height="26" rx="13" fill="#7C3AED" fill-opacity="0.14" stroke="#7C3AED" stroke-opacity="0.55"/>
      <text x="201" y="244" text-anchor="middle" class="mono" font-size="12" fill="#c4b5fd">Computer Vision</text>
      <rect x="284" y="226" width="110" height="26" rx="13" fill="#7C3AED" fill-opacity="0.14" stroke="#7C3AED" stroke-opacity="0.55"/>
      <text x="339" y="244" text-anchor="middle" class="mono" font-size="12" fill="#c4b5fd">Agentic AI</text>
    </g>

    <!-- right: neural network -->
    <g>
      <!-- edges L1 -> L2 -->
      <path class="edge" d="M700 95L800 70M700 95L800 125M700 95L800 180M700 95L800 235"/>
      <path class="edge" d="M700 150L800 70M700 150L800 125M700 150L800 180M700 150L800 235"/>
      <path class="edge" d="M700 205L800 70M700 205L800 125M700 205L800 180M700 205L800 235"/>
      <!-- edges L2 -> L3 -->
      <path class="edge" d="M800 70L900 120M800 70L900 180M800 125L900 120M800 125L900 180"/>
      <path class="edge" d="M800 180L900 120M800 180L900 180M800 235L900 120M800 235L900 180"/>

      <!-- signal pulses -->
      <circle r="3.5" fill="#c4b5fd"><animateMotion dur="2.2s" repeatCount="indefinite" path="M700 95L800 125L900 180"/></circle>
      <circle r="3.5" fill="#c4b5fd"><animateMotion dur="2.6s" begin="0.5s" repeatCount="indefinite" path="M700 205L800 70L900 120"/></circle>
      <circle r="3.5" fill="#c4b5fd"><animateMotion dur="2.4s" begin="1s" repeatCount="indefinite" path="M700 150L800 235L900 180"/></circle>
      <circle r="3.5" fill="#c4b5fd"><animateMotion dur="2s" begin="1.4s" repeatCount="indefinite" path="M700 150L800 180L900 120"/></circle>
      <circle r="3.5" fill="#c4b5fd"><animateMotion dur="2.8s" begin="0.2s" repeatCount="indefinite" path="M700 95L800 70L900 120"/></circle>

      <!-- nodes -->
      <g fill="#0d1117" stroke="#8b5cf6" stroke-width="2">
        <circle class="node" cx="700" cy="95" r="9"/>
        <circle class="node" cx="700" cy="150" r="9" style="animation-delay:.4s"/>
        <circle class="node" cx="700" cy="205" r="9" style="animation-delay:.8s"/>
        <circle class="node" cx="800" cy="70" r="9" style="animation-delay:.2s"/>
        <circle class="node" cx="800" cy="125" r="9" style="animation-delay:.6s"/>
        <circle class="node" cx="800" cy="180" r="9" style="animation-delay:1s"/>
        <circle class="node" cx="800" cy="235" r="9" style="animation-delay:1.4s"/>
        <circle class="node" cx="900" cy="120" r="11" fill="#7C3AED" style="animation-delay:.3s"/>
        <circle class="node" cx="900" cy="180" r="11" fill="#7C3AED" style="animation-delay:.9s"/>
      </g>
      <text x="800" y="275" text-anchor="middle" class="mono" font-size="11" fill="#6e7681">Research → Deployment</text>
    </g>
  </g>

  <rect x="1" y="1" width="998" height="298" rx="18" fill="none" stroke="url(#border)" stroke-width="2"/>
</svg>
