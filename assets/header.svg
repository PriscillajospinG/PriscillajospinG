<svg xmlns="http://www.w3.org/2000/svg" width="900" height="170" viewBox="0 0 900 170">
  <defs>
    <linearGradient id="name" x1="0" x2="1">
      <stop offset="0" stop-color="#7C3AED"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <linearGradient id="lineL" gradientUnits="userSpaceOnUse" x1="250" y1="0" x2="440" y2="0">
      <stop offset="0" stop-color="#7C3AED" stop-opacity="0"/>
      <stop offset="1" stop-color="#7C3AED"/>
    </linearGradient>
    <linearGradient id="lineR" gradientUnits="userSpaceOnUse" x1="460" y1="0" x2="650" y2="0">
      <stop offset="0" stop-color="#7C3AED"/>
      <stop offset="1" stop-color="#7C3AED" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <style>
    .sans{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Ubuntu,Helvetica,Arial,sans-serif}
    .a{animation:fade 1s ease-out both}
    .b{animation:fade 1s ease-out .4s both}
    .c{animation:fade 1s ease-out .8s both}
    @keyframes fade{from{opacity:0}to{opacity:1}}
  </style>

  <text x="450" y="70" text-anchor="middle" class="sans a" font-size="50" font-weight="700" letter-spacing="-1" fill="url(#name)">Priscilla Jospin G</text>
  <text x="450" y="106" text-anchor="middle" class="sans b" font-size="17" letter-spacing="3" fill="#8b949e">AI ENGINEER  ·  ML RESEARCHER  ·  FULL STACK DEVELOPER</text>

  <g class="c">
    <line x1="250" y1="135" x2="436" y2="135" stroke="url(#lineL)" stroke-width="1.5"/>
    <line x1="464" y1="135" x2="650" y2="135" stroke="url(#lineR)" stroke-width="1.5"/>
    <g>
      <rect x="444" y="129" width="12" height="12" fill="none" stroke="#7C3AED" stroke-width="2" transform="rotate(45 450 135)"/>
      <animateTransform attributeName="transform" type="rotate" from="0 450 135" to="360 450 135" dur="6s" repeatCount="indefinite"/>
    </g>
  </g>
</svg>
