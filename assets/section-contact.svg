<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="64" viewBox="0 0 1000 64">
  <defs>
    <linearGradient id="l" gradientUnits="userSpaceOnUse" x1="166" y1="0" x2="996" y2="0">
      <stop offset="0" stop-color="#7C3AED"/>
      <stop offset="1" stop-color="#7C3AED" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <style>
    .n{font:700 13px SFMono-Regular,Consolas,Menlo,monospace;fill:#c4b5fd;letter-spacing:1px}
    .p{font:500 13px SFMono-Regular,Consolas,Menlo,monospace;fill:#8b5cf6}
    .t{font:800 26px -apple-system,BlinkMacSystemFont,'Segoe UI',Ubuntu,Helvetica,Arial,sans-serif;fill:#8b5cf6;letter-spacing:-.3px}
    .line{stroke-dasharray:1000;stroke-dashoffset:1000;animation:draw 1.8s ease-out .2s forwards}
    .dot{animation:pulse 2s ease-in-out infinite}
    @keyframes draw{to{stroke-dashoffset:0}}
    @keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
  </style>
  <rect x="1" y="12" width="44" height="40" rx="10" fill="#0d1117" stroke="#7C3AED" stroke-opacity=".7"/>
  <text x="23" y="37" text-anchor="middle" class="n">07</text>
  <text x="60" y="30" class="p">./contact</text>
  <text x="60" y="56" class="t">Contact</text>
  <line x1="166" y1="46" x2="996" y2="46" stroke="url(#l)" stroke-width="2" class="line"/>
  <circle cx="166" cy="46" r="4" fill="#8b5cf6" class="dot"/>
</svg>
